# ============================================================
# githup-hong · 自动构建 HAP 并发布到 Release
# ============================================================
#
# 为什么要有这条流水线 ——
#   本工程的维护环境拿不到 HarmonyOS SDK（华为源在部分网络下不可达），
#   HAP 只能由官方工具链（hvigor + OHOS SDK）编译出来。
#   GitHub Actions 的 runner 出网不受限，所以把编译搬到 CI：
#   推代码即构建，产物自动挂到 Release。
#
# 工具链怎么来的 ——
#   华为的 Command Line Tools 官方下载页在国内网络常常取不到，
#   这里改用社区维护的鸿蒙 CI 容器镜像（Docker Hub，runner 可达），
#   镜像里已经装好了 ohpm / hvigorw / SDK 工具链。
#
# ══ 签名 ══
#   HarmonyOS NEXT 真机只认华为 AGC 颁发的证书链（p12 + cer + p7b）。
#   按有没有配 Secrets 分三档：
#     ① 配了 HARMONY_* Secrets → 用你的华为证书签，【真机可装】
#     ② 没配                   → SDK 自带密钥自签，【OpenHarmony 设备/模拟器可装】
#     ③ 自签也失败             → 仍上传【未签名】HAP，供你自己拿去签
# ============================================================

name: Build HAP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 装 JDK 17（签名工具需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Node 20（hvigor 是 Node 程序）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备日志
        run: |
          : > "$GITHUB_WORKSPACE/ci-build.log"
          echo "run=$GITHUB_RUN_ID" >> "$GITHUB_WORKSPACE/ci-build.log"

      # -------------------------------------------------------
      # CI 专用构建配置：不签名 + runtimeOS 用容器里的 SDK 能对上的那套
      # -------------------------------------------------------
      - name: 生成 CI 构建配置
        run: |
          cat > build-profile.json5 <<'JSON'
          {
            "app": {
              "signingConfigs": [],
              "products": [
                {
                  "name": "default",
                  "compatibleSdkVersion": "5.0.0(12)",
                  "runtimeOS": "OpenHarmony",
                  "buildOption": {
                    "strictMode": {
                      "caseSensitiveCheck": true,
                      "useNormalizedOHMUrl": true
                    }
                  }
                }
              ],
              "buildModeSet": [
                { "name": "debug" },
                { "name": "release" }
              ]
            },
            "modules": [
              {
                "name": "entry",
                "srcPath": "./entry",
                "targets": [
                  { "name": "default", "applyToProducts": ["default"] }
                ]
              }
            ]
          }
          JSON
          cat build-profile.json5

      # -------------------------------------------------------
      # 拉鸿蒙 CI 镜像并编译
      # -------------------------------------------------------
      - name: 拉鸿蒙 CI 镜像
        run: |
          set -x
          for tag in v5.0.5.200 v5.1.0.849 latest; do
            if docker pull "looha/oharmony-ci:${tag}" 2>&1 | tail -3; then
              echo "IMAGE=looha/oharmony-ci:${tag}" >> "$GITHUB_ENV"; break
            fi
          done
          echo "IMAGE=${IMAGE}"

      - name: 探查镜像里的工具链
        run: |
          docker run --rm --entrypoint bash "${IMAGE}" -lc '
            source /etc/profile 2>/dev/null || true
            echo "=== which ==="
            command -v hvigorw; command -v ohpm; command -v sdkmgr; command -v sdkmanager; command -v java; command -v node
            echo "=== 可能装工具链的位置 ==="
            ls / 2>/dev/null
            ls /opt 2>/dev/null
            ls /root 2>/dev/null
            echo "=== 找 SDK ==="
            find / -maxdepth 7 -type d \( -name "toolchains" -o -name "ets" \) 2>/dev/null | head -20
            echo "=== SDK 内容 ==="
            ls /opt/command-line-tools/sdk/default/openharmony 2>/dev/null
            ls /opt/command-line-tools/sdk/default/openharmony/ets 2>/dev/null
            echo "=== hvigorw 版本 ==="
            hvigorw --version 2>&1 | head -3
            echo "=== 可用插件版本 ==="
            npm view @ohos/hvigor-ohos-plugin versions --registry=https://repo.harmonyos.com/npm/ 2>&1 | tail -5
            echo "=== local.properties / sdk.dir ==="
            env | grep -i -E "ohos|sdk|command" || true
          ' 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"

      - name: 编译 HAP
        id: build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            --entrypoint bash "${IMAGE}" -lc '
            set -x
            source /etc/profile 2>/dev/null || true
            export TOOL_HOME=${TOOL_HOME:-/home/ohos/command-line-tools}
            export PATH="$TOOL_HOME/bin:$TOOL_HOME/ohpm/bin:$PATH"
            command -v hvigorw || find / -maxdepth 6 -name hvigorw 2>/dev/null | head -3
            # 让 hvigor 找得到 SDK
            SDKDIR=$(dirname $(find / -maxdepth 7 -type d -name toolchains 2>/dev/null | head -1))
            echo "SDKDIR=$SDKDIR"
            [ -n "$SDKDIR" ] && echo "sdk.dir=$SDKDIR" > local.properties
            cat local.properties 2>/dev/null
            hvigorw clean --no-daemon 2>&1 | tail -20
            hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon
          ' 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"
          echo "===== 产物 ====="
          find . -name "*.hap" | sort

      # -------------------------------------------------------
      # 签名
      # -------------------------------------------------------
      - name: 签名 HAP
        id: sign
        if: always()
        run: |
          UNSIGNED=$(find "$GITHUB_WORKSPACE" -name "*.hap" | head -1)
          echo "待签: $UNSIGNED"
          if [ -z "$UNSIGNED" ]; then echo "没有产物"; exit 0; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$UNSIGNED" "$GITHUB_WORKSPACE/out/githup-hong-unsigned.hap"
          # 签名工具在镜像里，把 jar 和自带密钥拷出来
          docker run --rm -v "$GITHUB_WORKSPACE/out:/out" --entrypoint bash "${IMAGE}" -lc '
            set -x
            LIB=$(find / -name "hap-sign-tool.jar" 2>/dev/null | head -1)
            echo "LIB=$LIB"
            if [ -z "$LIB" ]; then echo "镜像里没有签名工具"; exit 1; fi
            cp "$LIB" /out/hap-sign-tool.jar
            D=$(dirname "$LIB")
            cp "$D"/OpenHarmony*.p12 "$D"/OpenHarmony*.pem "$D"/Unsgned*.json /out/ 2>/dev/null || true
          ' 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"
          cd "$GITHUB_WORKSPACE/out"
          ls -l

          if [ -n "${{ secrets.HARMONY_P12_BASE64 }}" ] && [ -n "${{ secrets.HARMONY_CER_BASE64 }}" ] && [ -n "${{ secrets.HARMONY_P7B_BASE64 }}" ]; then
            echo "✅ 检测到华为证书 Secrets，正式签名（真机可装）"
            echo "${{ secrets.HARMONY_P12_BASE64 }}" | base64 -d > app.p12
            echo "${{ secrets.HARMONY_CER_BASE64 }}" | base64 -d > app.cer
            echo "${{ secrets.HARMONY_P7B_BASE64 }}" | base64 -d > app.p7b
            java -jar hap-sign-tool.jar sign-app -mode localSign \
              -keyAlias "${{ secrets.HARMONY_KEY_ALIAS }}" -signAlg SHA256withECDSA \
              -appCertFile app.cer -profileFile app.p7b \
              -inFile githup-hong-unsigned.hap -keystoreFile app.p12 \
              -outFile githup-hong-signed.hap \
              -keyPwd "${{ secrets.HARMONY_KEY_PWD }}" -keystorePwd "${{ secrets.HARMONY_STORE_PWD }}"
            echo "KIND=official" >> "$GITHUB_ENV"
          elif [ -f hap-sign-tool.jar ]; then
            echo "⚠️ 没有华为证书 Secrets，用 SDK 自带密钥自签"
            java -jar hap-sign-tool.jar sign-profile -mode localSign \
              -keyAlias "openharmony application profile release" -signAlg SHA256withECDSA \
              -profileCertFile OpenHarmonyProfileRelease.pem \
              -inFile UnsgnedReleasedProfileTemplate.json \
              -keystoreFile OpenHarmony.p12 -outFile app-profile.p7b \
              -keyPwd 123456 -keystorePwd 123456
            keytool -genkeypair -alias ohos-app -keyalg EC -groupname secp256r1 \
              -sigalg SHA256withECDSA -dname "CN=githup-hong, O=Buwrt, C=CN" \
              -keystore app.p12 -storetype pkcs12 -storepass 123456 -keypass 123456 -validity 9125
            keytool -exportcert -alias ohos-app -keystore app.p12 -storepass 123456 -rfc -file app.cer
            java -jar hap-sign-tool.jar sign-app -mode localSign \
              -keyAlias ohos-app -signAlg SHA256withECDSA \
              -appCertFile app.cer -profileFile app-profile.p7b \
              -inFile githup-hong-unsigned.hap -keystoreFile app.p12 \
              -outFile githup-hong-signed.hap -keyPwd 123456 -keystorePwd 123456
            echo "KIND=selfsigned" >> "$GITHUB_ENV"
          fi
          ls -lh

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hap
          path: out/*.hap
          if-no-files-found: warn

      # -------------------------------------------------------
      # 发布到 Release
      # -------------------------------------------------------
      - name: 发布/更新 Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG=v1.0.0
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "githup-hong v1.0.0" --notes "自动构建产物"
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            gh release delete-asset "$TAG" "$a" -y || true
          done
          ls out/ 2>/dev/null
          if ls out/*.hap >/dev/null 2>&1; then gh release upload "$TAG" out/*.hap --clobber; fi
          echo "---- 校验值 ----"
          for f in out/*.hap; do [ -f "$f" ] && echo "$f $(stat -c%s $f) sha256=$(sha256sum $f|cut -d' ' -f1)"; done
        continue-on-error: true

      # -------------------------------------------------------
      # 把日志推到 ci-logs 分支（维护环境读不到 Actions 日志接口，靠这个回传）
      # -------------------------------------------------------
      - name: 上报构建日志
        if: always()
        run: |
          git config user.name "githup-hong-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p ci
          cp "$GITHUB_WORKSPACE/ci-build.log" ci/last-build.log
          git add -f ci
          git commit -m "CI 日志 run $GITHUB_RUN_ID" || echo "无变化"
          git push -f origin ci-logs

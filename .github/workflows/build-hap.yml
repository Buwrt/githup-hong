# ============================================================
# githup-hong · 自动构建 HAP 并发布到 Release
# ============================================================
# 为什么在 CI 上构建 ——
#   本工程的维护环境拿不到 HarmonyOS SDK（华为源在部分网络下不可达），
#   HAP 只能由官方工具链（hvigor + OHOS SDK）编译出来。
#   GitHub Actions runner 出网不受限，所以编译搬到 CI：推代码即构建，
#   产物自动挂到 Release。
#
# 工具链 ——
#   社区维护的鸿蒙 CI 容器镜像 looha/oharmony-ci:v5.0.5.200，
#   内含 Command Line Tools 与 OpenHarmony SDK 5.0.1.106（API 12），
#   对得上本工程的目标 API 12。
#
# ══ 签名 ══
#   HarmonyOS NEXT 真机只认华为 AGC 颁发的证书链（p12 + cer + p7b）。
#   按有没有配 Secrets 分三档：
#     ① 配了 HARMONY_* Secrets → 用你的华为证书签，【真机可装】
#     ② 没配                   → SDK 自带密钥自签，【OpenHarmony 设备/模拟器可装】
#     ③ 自签也失败             → 仍上传【未签名】HAP，供你自己拿去签
# ============================================================

name: Build HAP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备日志
        run: |
          : > "$GITHUB_WORKSPACE/ci-build.log"

      - name: 生成容器内构建脚本
        run: |
          cat > "$GITHUB_WORKSPACE/ci-build.sh" <<'EOS'
          #!/bin/bash
          set -x
          source /etc/profile 2>/dev/null || true
          cd /src
          SDK=/opt/command-line-tools/sdk/default/openharmony
          echo "sdk.dir=$SDK" > local.properties
          echo "===== SDK 元数据 ====="
          head -20 "$SDK/ets/oh-uni-package.json"
          VER=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+' "$SDK/ets/oh-uni-package.json" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          API=$(grep -oE '"apiVersion"[[:space:]]*:[[:space:]]*"?[0-9]+' "$SDK/ets/oh-uni-package.json" | grep -oE '[0-9]+' | tail -1)
          [ -z "$API" ] && API=12
          MAJOR=$(echo "$VER" | cut -d. -f1-2).0
          echo "SDK版本=$VER  API=$API  候选=${MAJOR}(${API})"

          for HV in 5.19.8 5.17.6 5.15.5 5.14.2; do
            for COMPAT in "${MAJOR}(${API})" "5.0.0(12)"; do
              echo "########## 试 hvigor=$HV  compatibleSdkVersion=$COMPAT ##########"
              cat > hvigor/hvigor-config.json5 <<JSONCFG
          {
            "modelVersion": "5.0.0",
            "dependencies": {
              "@ohos/hvigor": "$HV",
              "@ohos/hvigor-ohos-plugin": "$HV"
            },
            "execution": { "daemon": false, "incremental": false, "parallel": false, "typeCheck": false },
            "logging": { "level": "info" },
            "debugging": { "stacktrace": false },
            "nodeOptions": { "maxOldSpaceSize": 8192 }
          }
          JSONCFG
              cat > build-profile.json5 <<JSONBP
          {
            "app": {
              "signingConfigs": [],
              "products": [
                {
                  "name": "default",
                  "compatibleSdkVersion": "$COMPAT",
                  "runtimeOS": "OpenHarmony",
                  "buildOption": { "strictMode": { "caseSensitiveCheck": true, "useNormalizedOHMUrl": true } }
                }
              ],
              "buildModeSet": [ { "name": "debug" }, { "name": "release" } ]
            },
            "modules": [
              {
                "name": "entry",
                "srcPath": "./entry",
                "targets": [ { "name": "default", "applyToProducts": ["default"] } ]
              }
            ]
          }
          JSONBP
              rm -rf entry/build
              hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon
              if find entry/build -name "*.hap" 2>/dev/null | grep -q .; then
                echo "BUILD_OK hvigor=$HV compatibleSdkVersion=$COMPAT"
                echo "HV=$HV" > /src/ci-build.env
                echo "COMPAT=$COMPAT" >> /src/ci-build.env
                break 2
              fi
            done
          done
          echo "===== 产物 ====="
          find entry/build -name "*.hap" | sort
          EOS
          chmod +x "$GITHUB_WORKSPACE/ci-build.sh"

      - name: 拉镜像
        run: |
          docker pull looha/oharmony-ci:v5.0.5.200 2>&1 | tail -2
          echo "IMAGE=looha/oharmony-ci:v5.0.5.200" >> "$GITHUB_ENV"

      - name: 编译 HAP
        id: build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            --entrypoint bash "${IMAGE}" -lc 'bash /src/ci-build.sh' \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"
          cat "$GITHUB_WORKSPACE/ci-build.env" 2>/dev/null || true

      - name: 签名 HAP
        id: sign
        if: always()
        run: |
          UNSIGNED=$(find "$GITHUB_WORKSPACE/entry/build" -name "*.hap" | head -1)
          echo "待签: $UNSIGNED"
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -z "$UNSIGNED" ]; then echo "没有产物，跳过签名"; exit 0; fi
          cp "$UNSIGNED" "$GITHUB_WORKSPACE/out/githup-hong-unsigned.hap"
          docker run --rm -v "$GITHUB_WORKSPACE/out:/out" --entrypoint bash "${IMAGE}" -lc '
            LIB=$(find /opt -name "hap-sign-tool.jar" | head -1)
            echo "LIB=$LIB"
            cp "$LIB" /out/hap-sign-tool.jar
            D=$(dirname "$LIB")
            cp "$D"/OpenHarmony*.p12 "$D"/OpenHarmony*.pem "$D"/Unsgned*.json /out/ 2>/dev/null || true
          ' 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"
          cd "$GITHUB_WORKSPACE/out"
          ls -l

          if [ -n "${{ secrets.HARMONY_P12_BASE64 }}" ] && [ -n "${{ secrets.HARMONY_CER_BASE64 }}" ] && [ -n "${{ secrets.HARMONY_P7B_BASE64 }}" ]; then
            echo "✅ 检测到华为证书 Secrets，正式签名（真机可装）"
            echo "${{ secrets.HARMONY_P12_BASE64 }}" | base64 -d > app.p12
            echo "${{ secrets.HARMONY_CER_BASE64 }}" | base64 -d > app.cer
            echo "${{ secrets.HARMONY_P7B_BASE64 }}" | base64 -d > app.p7b
            java -jar hap-sign-tool.jar sign-app -mode localSign \
              -keyAlias "${{ secrets.HARMONY_KEY_ALIAS }}" -signAlg SHA256withECDSA \
              -appCertFile app.cer -profileFile app.p7b \
              -inFile githup-hong-unsigned.hap -keystoreFile app.p12 \
              -outFile githup-hong-signed.hap \
              -keyPwd "${{ secrets.HARMONY_KEY_PWD }}" -keystorePwd "${{ secrets.HARMONY_STORE_PWD }}"
            echo "KIND=official" >> "$GITHUB_ENV"
          elif [ -f hap-sign-tool.jar ]; then
            echo "⚠️ 没有华为证书 Secrets，用 SDK 自带密钥自签"
            java -jar hap-sign-tool.jar sign-profile -mode localSign \
              -keyAlias "openharmony application profile release" -signAlg SHA256withECDSA \
              -profileCertFile OpenHarmonyProfileRelease.pem \
              -inFile UnsgnedReleasedProfileTemplate.json \
              -keystoreFile OpenHarmony.p12 -outFile app-profile.p7b \
              -keyPwd 123456 -keystorePwd 123456 2>&1 | tail -5
            keytool -genkeypair -alias ohos-app -keyalg EC -groupname secp256r1 \
              -sigalg SHA256withECDSA -dname "CN=githup-hong, O=Buwrt, C=CN" \
              -keystore app.p12 -storetype pkcs12 -storepass 123456 -keypass 123456 -validity 9125
            keytool -exportcert -alias ohos-app -keystore app.p12 -storepass 123456 -rfc -file app.cer
            java -jar hap-sign-tool.jar sign-app -mode localSign \
              -keyAlias ohos-app -signAlg SHA256withECDSA \
              -appCertFile app.cer -profileFile app-profile.p7b \
              -inFile githup-hong-unsigned.hap -keystoreFile app.p12 \
              -outFile githup-hong-signed.hap -keyPwd 123456 -keystorePwd 123456 2>&1 | tail -5
            echo "KIND=selfsigned" >> "$GITHUB_ENV"
          fi
          ls -lh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hap
          path: out/*.hap
          if-no-files-found: warn

      - name: 发布/更新 Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG=v1.0.0
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "githup-hong v1.0.0" --notes "自动构建产物"
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            gh release delete-asset "$TAG" "$a" -y || true
          done
          if ls out/*.hap >/dev/null 2>&1; then gh release upload "$TAG" out/*.hap --clobber; fi
          for f in out/*.hap; do
            [ -f "$f" ] && echo "$f $(stat -c%s $f) sha256=$(sha256sum $f | cut -d' ' -f1)"
          done
        continue-on-error: true

      - name: 上报构建日志
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout -B ci-logs
          mkdir -p ci
          cp "$GITHUB_WORKSPACE/ci-build.log" ci/last-build.log
          git add -f ci
          git commit -m "CI 日志 run $GITHUB_RUN_ID" || echo "无变化"
          git push -f origin ci-logs
